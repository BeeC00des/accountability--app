<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E4F69A" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="doerstab" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="doerstab — set goals, check in, and keep each other going." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- SF Pro is used on Apple devices via the system font stack; Inter is the closest open fallback elsewhere. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block" />
    <title>doerstab</title>
    <!-- Light mode by default; switch to dark before first paint only if the visitor chose it (no flash). -->
    <script>try { if (localStorage.getItem('accountable-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}</script>
  </head>
  <body>
    <noscript>doerstab needs JavaScript. Please enable it in your browser.</noscript>
    <div id="root"></div>
  </body>
</html>
